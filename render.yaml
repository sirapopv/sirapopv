# Render.com deployment configuration
services:
  - type: web
    name: youtube-podcast-converter
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # or 'free' for free tier (with limitations)
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8501
      - key: STREAMLIT_SERVER_PORT
        value: 8501
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      # Optional: Add authentication
      # - key: AUTH_USERNAME
      #   value: admin
      # - key: AUTH_PASSWORD_HASH
      #   sync: false  # Set manually in Render dashboard for security
    disk:
      name: converter-data
      mountPath: /app/output
      sizeGB: 10
